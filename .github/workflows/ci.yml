name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ '*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Dependency mode to exercise on the selected ref
        required: true
        type: choice
        options:
          - integration
          - release
      ref:
        description: Required ref; release mode requires a bare SemVer tag (or refs/tags/ tag)
        required: true
        type: string

permissions:
  contents: read

jobs:
  integration:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'integration')
    name: Integration / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    container: erlang:${{ matrix.otp }}
    env:
      ASYNC_DEPENDENCY_MODE: master
    strategy:
      fail-fast: false
      matrix:
        otp: ['29', '28', '27', '26', '25', '24', '23', '22', '21']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Verify cold checkout (no cache or tracked lock)
        run: |
          set -eu
          # actions/checkout gives each job a fresh workspace; this workflow
          # has no cache and rebar.lock is not tracked, so resolution is cold.
          if [ -e _checkouts ]; then
            echo '_checkouts must not exist in a cold CI workspace' >&2
            exit 1
          fi

      - name: Dependency tree
        run: rebar3 tree -v

      - name: Compile
        run: rebar3 compile

      - name: Common Test
        run: rebar3 as test clean -a && rebar3 ct

  release:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')
    name: Release / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    container: erlang:${{ matrix.otp }}
    strategy:
      fail-fast: false
      matrix:
        otp: ['29', '28', '27', '26', '25', '24', '23', '22', '21']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Validate SemVer release ref
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -eu
          tag="${RELEASE_REF#refs/tags/}"
          export RELEASE_TAG="$tag"
          erl -noshell -eval '
            Tag = os:getenv("RELEASE_TAG"),
            Pattern = "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?(\\+[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$",
            case re:run(Tag, Pattern, [{capture, none}]) of
                match -> io:format("Valid SemVer release ref: ~s~n", [Tag]);
                nomatch ->
                    io:format(standard_error, "Invalid SemVer release ref: ~s~n", [Tag]),
                    halt(1)
            end,
            halt().
          '

      - name: Assert release dependency configuration
        run: |
          set -eu
          test -z "${ASYNC_DEPENDENCY_MODE:-}"
          erl -noshell -eval '
            {ok, Config} = file:consult("rebar.config"),
            {deps, Deps} = lists:keyfind(deps, 1, Config),
            3 = length(Deps),
            true = lists:all(
              fun({_Name, {git, _Url, {tag, Tag}}})
                    when is_list(Tag), Tag =/= [] -> true;
                 (_) -> false
              end,
              Deps),
            {project_plugins, Plugins} = lists:keyfind(project_plugins, 1, Config),
            {rebar3_docker_ci, {git, _PluginUrl, {tag, PluginTag}}} =
              lists:keyfind(rebar3_docker_ci, 1, Plugins),
            true = is_list(PluginTag),
            false = lists:any(
              fun({_Name, {git, _Url, {branch, _Branch}}}) -> true;
                 (_) -> false
              end,
              Deps ++ Plugins),
            io:format("release config has three Git-tag runtime deps and a Git-tag docker_ci plugin~n"),
            halt().
          '

      - name: Verify cold checkout (no cache or tracked lock)
        run: |
          set -eu
          # actions/checkout gives each job a fresh workspace; this workflow
          # has no cache and rebar.lock is not tracked, so resolution is cold.
          if [ -e _checkouts ]; then
            echo '_checkouts must not exist in a cold CI workspace' >&2
            exit 1
          fi

      - name: Dependency tree
        run: |
          set -eu
          rebar3 tree -v | tee /tmp/async-release-tree.txt
          ! grep -E '(^|[[:space:]])(astranaut|erlando|lenses)[^[:cntrl:]]*master' /tmp/async-release-tree.txt

      - name: Compile
        run: rebar3 compile

      - name: Common Test
        run: rebar3 as test clean -a && rebar3 ct
